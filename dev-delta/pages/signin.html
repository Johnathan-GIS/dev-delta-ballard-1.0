<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In & Register - Amazing Travels</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../styles/style.css">
</head>

<body class="bg-light">

  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">Amazing Travels</a>
      <div class="collapse navbar-collapse justify-content-end">
        <ul class="navbar-nav gap-3">
          <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="signin.html">Sign In / Register</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container my-5" style="max-width: 420px;">

    <div class="card shadow-sm border-0 p-4 bg-white rounded">

      <!-- Tabs to switch between Sign In and Register -->
      <ul class="nav nav-pills nav-fill mb-4" id="authTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="signin-tab" data-bs-toggle="tab" data-bs-target="#signinPane"
            type="button" role="tab">Sign In</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#registerPane" type="button"
            role="tab">Register</button>
        </li>
      </ul>

      <div class="tab-content" id="authTabContent">

        <!-- Sign In Pane -->
        <div class="tab-pane fade show active" id="signinPane" role="tabpanel">
          <h2 class="h5 fw-bold text-center mb-3">Sign In</h2>
          <form id="signinForm">
            <div class="mb-3">
              <label for="usernameInput" class="form-label">Username</label>
              <input type="text" class="form-control" id="usernameInput" placeholder="Enter username" required />
            </div>
            <div class="mb-3">
              <label for="passwordInput" class="form-label">Password</label>
              <input type="password" class="form-control" id="passwordInput" placeholder="Enter password" required />
            </div>
            <button type="submit" id="signin-btn" class="btn btn-dark w-100 py-2">Sign In</button>
          </form>
        </div>

        <!-- Register Pane -->
        <div class="tab-pane fade" id="registerPane" role="tabpanel">
          <h2 class="h5 fw-bold text-center mb-3">Create New Account</h2>
          <form id="registerForm">
            <div class="mb-3">
              <label for="regUsernameInput" class="form-label">Choose Username</label>
              <input type="text" class="form-control" id="regUsernameInput" placeholder="Choose username" required />
            </div>
            <div class="mb-3">
              <label for="regPasswordInput" class="form-label">Choose Password</label>
              <input type="password" class="form-control" id="regPasswordInput" placeholder="Choose password"
                required />
            </div>
            <button type="submit" id="register-btn" class="btn btn-primary w-100 py-2">Register & Sign In</button>
          </form>
        </div>

      </div>

      <!-- Dynamic Feedback Message Area -->
      <div id="message" class="mt-3 text-center small"></div>

    </div>

  </main>

  <!-- Footer -->
  <footer class="text-center py-4 text-muted small">
    <p class="mb-0">&copy; 2026 Amazing Travels. By Johnathan Ballard.</p>
  </footer>

  <!-- Bootstrap & Functional JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/bootstrap.bundle.min.js"></script>
  <script src="../scripts/signin.js"></script>
</body>

</html>
